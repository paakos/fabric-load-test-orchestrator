[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promotion_gate"
version = "0.1.0"
description = "Gate de promoción de modelos semánticos de Power BI y Fabric: BPA, test de carga, informe y Capacity Metrics."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
cli = ["requests>=2.31"]
dev = ["pytest>=8", "requests>=2.31"]

[project.scripts]
smgate = "promotion_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
