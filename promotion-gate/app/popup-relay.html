<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; color: #15233f; background: #eef0ec; }
      main { max-width: 340px; padding: 32px; text-align: center; }
      button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 4px; background: #1d3fbf; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <!-- La app corre en un iframe del portal de Fabric: esta página abre el login de Microsoft y le devuelve la respuesta. -->
    <main>
      <p id="msg">Continúa para iniciar sesión con tu cuenta de Microsoft.</p>
      <button id="go" type="button">Continuar</button>
    </main>
    <script type="module" src="/src/popup-relay.ts"></script>
  </body>
</html>
